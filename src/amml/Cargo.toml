[package]
name = "freecam-amml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "alaydriem_freecam"
crate-type = ["cdylib", "rlib"]

[dependencies]
amm-client = { workspace = true, features = ["egui"] }
amm-core = { workspace = true, features = ["egui"] }
amml-api.workspace = true
amml-i18n.workspace = true
amml-ui.workspace = true
chrono.workspace = true
curia.workspace = true
egui.workspace = true
freecam-core.workspace = true
freecam-ui.workspace = true

[dev-dependencies]
amml-api = { workspace = true, features = ["test"] }
amm-client = { workspace = true, features = ["egui", "test-support"] }
hcl-rs.workspace = true
stats_alloc.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "write_manifest"
path = "examples/write_manifest.rs"

[lints]
workspace = true
